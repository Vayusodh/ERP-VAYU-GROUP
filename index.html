<div class="portal">
  <aside class="sidebar">
    <h2>VAYU ERP</h2>
    <ul>
      <li>Dashboard</li>
      <li>Project Master</li>
      <li>Vendor Master</li>
      <li>Item Master</li>
      <li>PO Entry</li>
      <li>PO Register</li>
      <li>Logistics</li>
    </ul>
  </aside>

  <main class="content">
    <header>
      <h3>PO Entry</h3>
      <button>Save</button>
    </header>

    <form>
      <section>
        <h4>Project Details</h4>
        <input placeholder="Project ID">
        <input placeholder="Project Name">
        <input placeholder="Site Location">
      </section>

      <section>
        <h4>Vendor Details</h4>
        <input placeholder="Vendor Name">
        <input placeholder="Contact Person">
        <input placeholder="GST No">
      </section>

      <section>
        <h4>PO Details</h4>
        <input placeholder="PO Number">
        <input placeholder="PO Date">
        <input placeholder="Project Name">
        <input placeholder="Vendor Name">
      </section>

      <section>
        <h4>Item Details</h4>
        <table>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Tax</th>
            <th>Total</th>
          </tr>
          <tr>
            <td><input></td>
            <td><input></td>
            <td><input></td>
            <td><input></td>
            <td><input></td>
          </tr>
        </table>
      </section>

      <button type="submit">Submit PO</button>
    </form>
  </main>
</div>
