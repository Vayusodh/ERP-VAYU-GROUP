<style>

*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--ln);background:var(--card);border-radius:6px;padding:6px 12px}button.pr{background:var(--ac);border-color:var(--ac);color:#fff}button.dg{color:var(--er)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select{border:1px solid var(--ln);background:var(--card);border-radius:6px;padding:6px 9px;min-width:0}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--nv);padding:16px}
#login .box{background:var(--card);border-radius:10px;padding:28px;width:min(380px,100%);display:grid;gap:12px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;background:var(--ac);color:#fff;font-weight:600;flex:none}
#sb{position:fixed;inset:0 auto 0 0;width:240px;background:var(--nv);color:#c5cfe8;overflow:auto;z-index:30;transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;gap:10px;align-items:center;padding:16px;color:#fff}.brand small{display:block;color:#8d9bc0;font-size:11px}
#nav a{display:flex;gap:10px;padding:9px 16px;color:inherit;text-decoration:none;cursor:pointer;border-left:3px solid transparent}#nav a:hover{background:#16295a}#nav a.on{background:#1b3470;color:#fff;border-left-color:#5b8def}
#main{margin-left:240px;min-width:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
header .sp{flex:1}#burger{display:none}#bn{background:var(--er);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;margin-left:4px;font-style:normal}
#view{padding:20px;max-width:1500px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}h3{margin:0 0 12px}
.mu{color:var(--mu)}.er{color:var(--er)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.kc{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;cursor:pointer;border-top:3px solid var(--ac)}.kc b{display:block;font-size:22px}.kc span{color:var(--mu);font-size:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:14px 0}
.pn{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;min-width:0}
.pn ul{list-style:none;margin:0;padding:0}.pn li{padding:6px 0;border-bottom:1px solid var(--ln);cursor:pointer;display:flex;justify-content:space-between;gap:8px}.pn li:last-child{border:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--ln);border-radius:8px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}th{background:var(--bg);font-weight:500;color:var(--mu);cursor:pointer;user-select:none}tr:last-child td{border:0}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}.b.ok{background:var(--okb);color:var(--ok)}.b.wn{background:var(--wnb);color:var(--wn)}.b.er{background:var(--erb);color:var(--er)}.b.in{background:var(--inb);color:var(--ac)}
.ch{width:100%;height:auto}.ch text{font-size:9px;fill:var(--mu)}
.note{background:var(--wnb);color:var(--wn);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:13px}
dialog{border:0;border-radius:10px;padding:20px;width:min(760px,94vw);max-height:90vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fg label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tl{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}.tl span{flex:1;min-width:90px;padding:6px;border-radius:5px;background:var(--bg);font-size:12px;text-align:center;color:var(--mu)}.tl span.d{background:var(--inb);color:var(--ac);font-weight:500}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--nv);color:#fff;padding:10px 16px;border-radius:6px;z-index:90;display:none}
#sr{position:absolute;background:var(--card);border:1px solid var(--ln);border-radius:6px;z-index:5;width:min(560px,90vw)}#sr div{padding:7px 12px;cursor:pointer}
@media(max-width:900px){#sb{transform:translateX(-100%)}#sb.open{transform:none}#main{margin-left:0}#burger{display:inline-block}#view{padding:14px}}
@media print{#sb,header,.tb,.nop{display:none!important}#main{margin:0}}
